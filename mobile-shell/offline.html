<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Offline – TV Time Tracker</title>
    <style>
      body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
             background: #141414; color: #fff; font-family: system-ui, -apple-system, sans-serif; text-align: center; padding: 24px; }
      h1 { font-size: 24px; margin: 16px 0 8px; }
      p { color: #9ca3af; margin: 0 0 24px; }
      button { background: #ffd200; color: #141414; font-weight: 700; border: 0; border-radius: 12px; padding: 12px 24px; font-size: 16px; }
    </style>
  </head>
  <body>
    <main>
      <img src="logo.png" alt="" width="64" height="64" style="border-radius: 12px" />
      <h1>You're offline</h1>
      <p>Reconnect to keep tracking your shows.</p>
      <button onclick="location.href='https://tvtime.online/dashboard'">Try again</button>
    </main>
  </body>
</html>
